name: Release
on:
  push:
    branches:
      - main
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install semantic-release package
        run: npm install -g semantic-release @semantic-release/changelog conventional-changelog-conventionalcommits -D

      - name: Create GH app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: "${{ vars.SEMANTIC_RELEASE_APP_CLIENT_ID }}"
          private-key: "${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: semantic-release
